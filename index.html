<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>H3 Scout</title>
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="H3 Scout">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#0f172a; --bg2:#16213a; --card:#1c2942; --card2:#233450;
  --text:#eef2ff; --muted:#93a1c4; --line:#2c3b5c;
  --accent:#3b82f6; --accent2:#60a5fa;
  --good:#22c55e; --ok:#84cc16; --neutral:#eab308; --bad:#f97316; --err:#ef4444;
  --home:#3b82f6; --away:#ef4444;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); overscroll-behavior:none;}
button{font-family:inherit;}
#app{max-width:900px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom);}
header.topbar{position:sticky; top:0; z-index:20; background:rgba(15,23,42,.92); backdrop-filter:blur(8px); padding:10px 16px calc(10px + env(safe-area-inset-top)); padding-top:calc(10px + env(safe-area-inset-top)); display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line);}
header.topbar h1{font-size:16px; margin:0; flex:1; font-weight:700; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
header.topbar .back{background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:7px 11px; font-size:13px;}
main{flex:1; padding:12px; padding-bottom:28px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:10px; scroll-margin-top:100px;}
.card h2{margin:0 0 8px; font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--accent); color:#fff; border:none; border-radius:11px; padding:11px 16px; font-size:14px; font-weight:600; cursor:pointer; line-height:1.25;}
.btn.secondary{background:var(--card2); color:var(--text); border:1px solid var(--line);}
.btn.ghost{background:transparent; color:var(--accent2); border:1px solid var(--line);}
.btn.block{display:flex; width:100%;}
.btn:disabled{opacity:.4;}
/* Kompaktere Variante für die häufig getippten Aktions-/Auswahl-Buttons im Spielfeld (Schnelltags,
   Art-/Bewertungs-Auswahl) — spart Platz, damit bei jedem Punkt weniger gescrollt werden muss. */
.btn-sm{padding:8px 10px; font-size:12.5px; border-radius:9px; gap:4px;}
.row{display:flex; gap:8px; flex-wrap:wrap;}
.row.field-quickgrid{gap:7px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
/* Spielfeld + zugehörige Aktions-Buttons: das Feld soll immer der große, dominante Teil sein — die
   Buttons stehen als schmale Spalte drumherum, nicht als breite, leere Fläche. Auf schmalen
   Hochformat-Bildschirmen (Handy) steht das (dann volle Breite nutzende) Feld über den Buttons, ab
   Tablet-Breite bzw. im Querformat stehen sie nebeneinander. */
.field-row{display:flex; flex-direction:column; gap:10px;}
.field-court{width:100%; scroll-margin-top:100px;}
.field-court svg{width:100%; height:auto; max-width:440px; margin:0 auto; scroll-margin-top:100px; display:block;}
.field-actions{display:flex; flex-direction:column; gap:7px;}
.field-actions.grid2col{display:grid; grid-template-columns:1fr 1fr; gap:7px;}
@media (min-width:700px){
  #app{max-width:1180px;}
  .field-row{flex-direction:row; align-items:flex-start; position:relative;}
  /* Feld bekommt den Großteil des Platzes ... */
  .field-court{flex:1 1 auto; max-width:560px;}
  .field-court svg{max-width:560px;}
  /* ... die Buttons bleiben eine schmale Spalte daneben statt über die ganze Breite gedehnter Reihen. */
  .field-actions{flex:0 0 190px; max-width:190px; justify-content:flex-start;}
  .field-actions.grid2col{grid-template-columns:1fr 1fr;}
  /* Sobald eine Auswahl (Art/Bewertung/Spielerliste o.ä.) mehr Platz braucht als die schmale Spalte
     hergibt, legt sie sich stattdessen als Panel ÜBER einen Teil des Feldes — das Feld bleibt dabei
     groß und sichtbar, es wird bewusst in Kauf genommen, dass ein Teil kurzzeitig verdeckt ist,
     statt das ganze Layout wieder zusammenzuquetschen. */
  .field-actions.overlay{
    position:absolute; top:0; right:0; z-index:5;
    width:min(300px, 52%); max-width:300px; flex:none;
    background:rgba(20,29,48,.97); border:1px solid var(--line); border-radius:12px;
    padding:12px; max-height:100%; overflow-y:auto;
    box-shadow:0 10px 28px rgba(0,0,0,.45);
  }
}
@media (orientation:landscape) and (max-height:520px){
  /* Handy im Querformat: sehr wenig Höhe verfügbar — Kopfzeile/Karten zusätzlich verschlanken. Das
     Spielfeld ist (im Hochformat-Seitenverhältnis) oft höher als hier überhaupt Platz ist, wenn es
     nur nach Breite skaliert wird — deshalb hier zusätzlich per max-height begrenzen, damit es immer
     KOMPLETT sichtbar (und antippbar) bleibt, statt unten aus dem Bildschirm zu laufen. */
  header.topbar{padding-top:calc(6px + env(safe-area-inset-top)); padding-bottom:6px;}
  main{padding:8px;}
  .card{padding:9px; margin-bottom:8px;}
  .card h2{font-size:12.5px; margin-bottom:6px;}
  .field-court{max-width:340px;}
  /* Die Breite wird direkt per min()/aspect-ratio als eindeutiger Pixelwert berechnet (statt über
     mehrdeutiges width:auto + max-width + max-height gleichzeitig) — Feld-Seitenverhältnis ist
     144:174 (≈0.8276). So passt die SVG-Box IMMER exakt zum gezeichneten Feld (kein leerer Rand /
     "Letterboxing"), in dem Taps sonst ins Leere gehen könnten, und das Feld bleibt garantiert
     komplett innerhalb der knappen Bildschirmhöhe sichtbar. */
  .field-court svg{width:min(340px, 58vh * 0.827586); aspect-ratio:144/174; height:auto; max-width:none;}
}
input,select{width:100%; background:var(--bg2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:11px 12px; font-size:15px;}
label{font-size:12px; color:var(--muted); display:block; margin-bottom:5px; margin-top:10px;}
.list-item{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--bg2); border-radius:10px; padding:10px 12px; margin-bottom:8px;}
.pill{background:var(--card2); border-radius:20px; padding:3px 10px; font-size:12px; color:var(--muted);}
.empty{color:var(--muted); font-size:14px; text-align:center; padding:24px 8px;}
.matchrow{display:flex; align-items:center; justify-content:space-between; padding:14px; background:var(--bg2); border-radius:12px; margin-bottom:10px; cursor:pointer;}
.matchrow .vs{font-weight:700;}
.matchrow .status{font-size:12px; color:var(--muted);}
a.linklike{color:var(--accent2); text-decoration:none;}
.icon-btn{background:none;border:none;color:var(--muted);font-size:20px;padding:4px 8px;cursor:pointer;}
::-webkit-scrollbar{display:none;}
.ev-perfect{border-color:var(--good) !important; color:var(--good) !important;}
.ev-good{border-color:var(--ok) !important; color:var(--ok) !important;}
.ev-neutral{border-color:var(--neutral) !important; color:var(--neutral) !important;}
.ev-poor{border-color:var(--bad) !important; color:var(--bad) !important;}
.ev-error{border-color:var(--err) !important; color:var(--err) !important;}
@media print{
  body{background:#fff; color:#111;}
  header.topbar, .btn, .row > button, #actionPanel { display:none !important; }
  .card{ border:1px solid #ccc; background:#fff; color:#111; break-inside:avoid; }
  .card h2{ color:#333; }
  th,td{ color:#111 !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
